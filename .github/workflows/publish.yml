name: Publish

# Push a tag vX.Y.Z that matches package.json to publish that version to npm.
# update.yml starts this workflow on its own tag, because its push starts nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 # zizmor: ignore[adhoc-packages] trusted publishing needs npm 11
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun test
      - run: bun run typecheck
      - run: bun run size
      - run: npm publish
      - run: npx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
