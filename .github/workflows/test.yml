name: ⚙️ Test
on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: ⬇️ Checkout repository
      - uses: oven-sh/setup-bun@v2
        name: 🛠️ Setup bun
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        name: 📦 Setup Node.js
        with:
          node-version: 22
      - name: 🔍 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧹 Lint
        run: bun run lint
      - name: 🏗️ Build
        run: bun run build
      - name: 🧪 Test
        run: bun run test
