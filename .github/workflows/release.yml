name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          submodules: true

      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check for changesets
        id: changesets
        run: |
          if [ -n "$(ls -A .changeset/*.md 2>/dev/null | grep -v README.md)" ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format generated files
        if: steps.changesets.outputs.has_changesets == 'true'
        run: bun run lint:fix

      - name: Get version
        if: steps.changesets.outputs.has_changesets == 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit and push release branch
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b changeset-release/main 2>/dev/null || git checkout changeset-release/main
          git add -A
          git commit -m "chore(release): v${{ steps.version.outputs.version }}" --no-verify
          git push -f origin changeset-release/main

      - name: Create PR
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          # Check if PR already exists
          PR_EXISTS=$(gh pr list --head changeset-release/main --json number --jq '.[0].number')
          if [ -n "$PR_EXISTS" ]; then
            echo "✅ PR #$PR_EXISTS already exists"
          else
            # Try to create PR (will fail if org permissions block it)
            if gh pr create \
              --title "chore(release): v${{ steps.version.outputs.version }}" \
              --body "This PR was opened by the release workflow. Merge it to publish v${{ steps.version.outputs.version }} to npm." \
              --base main \
              --head changeset-release/main; then
              echo "✅ PR created successfully"
            else
              echo "⚠️ Failed to create PR automatically due to organization permissions."
              echo "📝 Please create the PR manually:"
              echo "   gh pr create --head changeset-release/main --base main --title \"chore(release): v${{ steps.version.outputs.version }}\" --body \"Release v${{ steps.version.outputs.version }}\""
              echo "   Or visit: https://github.com/${{ github.repository }}/compare/main...changeset-release/main"
            fi
          fi

      - name: Configure npm
        if: steps.changesets.outputs.has_changesets == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'false'
        id: publish
        run: |
          # Check if current version is already published
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          PUBLISHED=$(npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null || echo "")

          if [ -z "$PUBLISHED" ]; then
            echo "Publishing $PACKAGE_NAME@$CURRENT_VERSION"
            bun run release
            echo "published=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION already published, skipping"
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.publish.outputs.published == 'true'
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create tag if it doesn't exist
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
            echo "✅ Created tag v$VERSION"
          else
            echo "ℹ️ Tag v$VERSION already exists"
          fi

          # Push tags
          git push origin "v$VERSION" || echo "⚠️ Tag may already exist on remote"
